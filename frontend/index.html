<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NPU-Assistant 校园助手：辅导员数字分身、LLM Wiki 知识库、模型管理与微信/QQ 机器人。" />
  <meta name="theme-color" content="#0b3d91" />
  <title>NPU-Assistant · 辅导员数字分身</title>

  <div class="app" id="app">
    <!-- ============================ 左侧导航 ============================ -->
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="38" height="38">
            <defs>
              <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#1668dc" />
                <stop offset="1" stop-color="#0b3d91" />
              </linearGradient>
            </defs>
            <rect width="48" height="48" rx="13" fill="url(#brandGrad)" />
            <path d="M24 10.5 39 18l-15 7.5L9 18Z" fill="#4ff0e2" />
            <path d="M14 22.5V31c0 3.3 4.5 5.8 10 5.8s10-2.5 10-5.8v-8.5l-10 5Z" fill="#ffffff" opacity=".9" />
            <path d="M39 18v8" stroke="#4ff0e2" stroke-width="2" stroke-linecap="round" />
          </svg>
        </div>
        <div class="brand-text">
          <strong>NPU-Assistant</strong>
          <span>辅导员数字分身</span>
        </div>
        <button class="icon-btn sidebar-close" id="sidebarClose" type="button" aria-label="关闭导航">
          <svg class="i" aria-hidden="true"><use href="#i-x"></use></svg>
        </button>
      </div>

      <nav class="nav" id="nav">
        <a class="nav-item" href="#/chat" data-view="chat">
          <span class="nav-ico"><svg class="i" aria-hidden="true"><use href="#i-chat"></use></svg></span>
          <span class="nav-label">对话</span>
          <span class="nav-desc">Ask 小南</span>
        </a>
        <a class="nav-item" href="#/knowledge" data-view="knowledge">
          <span class="nav-ico"><svg class="i" aria-hidden="true"><use href="#i-book"></use></svg></span>
          <span class="nav-label">知识库</span>
          <span class="nav-desc">LLM Wiki</span>
        </a>
        <a class="nav-item" href="#/models" data-view="models">
          <span class="nav-ico"><svg class="i" aria-hidden="true"><use href="#i-cpu"></use></svg></span>
          <span class="nav-label">模型</span>
          <span class="nav-desc">Providers</span>
        </a>
        <a class="nav-item" href="#/bots" data-view="bots">
          <span class="nav-ico"><svg class="i" aria-hidden="true"><use href="#i-robot"></use></svg></span>
          <span class="nav-label">机器人</span>
          <span class="nav-desc">QQ / 微信</span>
        </a>
        <a class="nav-item" href="#/settings" data-view="settings">
          <span class="nav-ico"><svg class="i" aria-hidden="true"><use href="#i-settings"></use></svg></span>
          <span class="nav-label">设置</span>
          <span class="nav-desc">人设与检索</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="health-card" id="healthCard" title="后端服务状态">
          <span class="health-dot is-pending" id="healthDot"></span>
          <div class="health-text">
            <strong id="healthTitle">正在连接服务…</strong>
            <span id="healthModel">NPU-Assistant</span>
          </div>
        </div>
        <div class="sidebar-meta">
          <span>v0.2.0 · LLM Wiki</span>
          <a href="/api/docs" target="_blank" rel="noopener">API 文档
            <svg class="i i-xs" aria-hidden="true"><use href="#i-external"></use></svg>
          </a>
        </div>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

    <!-- ============================ 右侧主区 ============================ -->
    <div class="shell">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="打开导航">
          <svg class="i" aria-hidden="true"><use href="#i-menu"></use></svg>
        </button>
        <div class="topbar-title">
          <h1 id="pageTitle">对话</h1>
          <p id="pageSubtitle">与辅导员数字分身「小南」对话，回答基于知识库并标注引用。</p>
        </div>
        <div class="topbar-actions" id="topbarActions"></div>
      </header>
      <main class="view" id="view" tabindex="-1">
        <div class="boot-screen">
          <div class="spinner spinner-lg" aria-hidden="true"></div>
          <p>正在加载页面…</p>
        </div>
      </main>
    </div>
  </div>

  <div class="toast-root" id="toastRoot" role="status" aria-live="polite" aria-atomic="false"></div>
  <div id="modalRoot"></div>
  <div id="drawerRoot"></div>
