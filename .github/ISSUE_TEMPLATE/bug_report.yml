name: Bug 报告
description: 报告可复现的功能异常
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 Issue。安全漏洞不要在这里公开，请按 SECURITY.md 私下报告。
  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      placeholder: v0.2.0 / develop@abcdef
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      options:
        - Windows + 本机 Python
        - Linux / macOS + 本机 Python
        - Docker（如有）
        - 其他
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 请先移除 API Key、令牌、学生个人信息。
      render: shell
