name: Release

# 推送 vX.Y.Z 或 dataset-vYYYY.N 标签时，自动把仓库里的发布说明同步为
# GitHub Release。也可以在 Actions 页面手动运行本工作流，补发/重发已有 tag。
on:
  push:
    tags:
      - "v*"
      - "dataset-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（如 v0.2.1 或 dataset-v2026.22）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve tag kind
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == dataset-v* ]]; then
            echo "kind=dataset" >> "$GITHUB_OUTPUT"
            echo "数据集发布：$TAG"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "kind=app" >> "$GITHUB_OUTPUT"
            echo "应用发布：$TAG"
          else
            echo "::error::不支持的 tag：$TAG（应为 vX.Y.Z 或 dataset-vYYYY.N）"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure release notes helper
        run: |
          set -euo pipefail
          if [[ -f scripts/release_notes.py ]]; then
            exit 0
          fi
          # 补发旧 tag 时，该提交里可能还没引入脚本；从默认分支临时取用。
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          echo "::warning::${{ steps.tag.outputs.value }} 不含 scripts/release_notes.py，改从 $DEFAULT_BRANCH 取用"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git checkout FETCH_HEAD -- scripts/release_notes.py

      - name: Verify tag matches APP_VERSION
        if: steps.tag.outputs.kind == 'app'
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: python scripts/release_notes.py --verify-version "$TAG"

      - name: Extract application release notes
        if: steps.tag.outputs.kind == 'app'
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set +e
          python scripts/release_notes.py --version "$TAG" --output release-notes.md
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "::warning::CHANGELOG.md 中没有 $TAG 章节，改用 GitHub 自动生成的 release notes"
            rm -f release-notes.md
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Extract dataset release notes
        if: steps.tag.outputs.kind == 'dataset'
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set +e
          python scripts/release_notes.py --dataset-version "$TAG" --output release-notes.md
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "::warning::没有找到 $TAG 的 dataset card，改用 GitHub 自动生成的 release notes"
            rm -f release-notes.md
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
          KIND: ${{ steps.tag.outputs.kind }}
        run: |
          set -euo pipefail
          NOTES=()
          if [[ -s release-notes.md ]]; then
            NOTES=(--notes-file release-notes.md)
          else
            NOTES=(--generate-notes)
          fi

          FLAGS=()
          if [[ "$KIND" == "dataset" ]]; then
            # 数据集 release 不抢应用 release 的 Latest 标记。
            FLAGS+=(--latest=false)
          elif [[ "$TAG" == *-* ]]; then
            FLAGS+=(--prerelease)
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 注意：gh release edit 不支持 --generate-notes，只有拿到 notes 文件时才改正文。
            if [[ -s release-notes.md ]]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
                --title "$TAG" "${FLAGS[@]}" --notes-file release-notes.md
            else
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" "${FLAGS[@]}"
            fi
            echo "已更新已有 release：$TAG"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TAG" "${NOTES[@]}" "${FLAGS[@]}"
            echo "已创建 release：$TAG"
          fi
